<section class="bg-white p-2 rounded-xl">


    <form #CreateForm (submit)="creatPost($event )">
        <div class="head flex items-center gap-1.5">
            <div class="user-photo w-10 h-10 p-0.5 rounded-full border-2 border-gray-400">
                <img class="w-full h-full rounded-full" src="./Images/default-profile.png" alt="">
            </div>
            <div class="user-toggle">
                <div class="user-name my-1">
                    <h2 class="font-bold text-sm"> Youssef </h2>
                </div>
              <div class="post-privacy flex items-center gap-2 bg-slate-100 rounded-full px-3 py-1 mt-1 text-sm">

    <span class="text-slate-600">

        @switch (privacy()) {

            @case ('Public') {
                <i class="fa-solid fa-earth-americas" aria-hidden="true"></i>
            }

            @case ('Friends') {
                <i class="fa-solid fa-user-group" aria-hidden="true"></i>
            }

            @case ('Only me') {
                <i class="fa-solid fa-lock" aria-hidden="true"></i>
            }

        }

    </span>

    <select #privacySelect
            aria-label="Post privacy"
            [value]="privacy()"
            (change)="privacy.set(privacySelect.value)"
            class="bg-transparent outline-none cursor-pointer">

        <option value="Public">Public</option>
        <option value="Friends">Friends</option>
        <option value="Only me">Only me</option>

    </select>

</div>
            </div>
        </div>


        <div class="body">
            <div class="mt-3">
                <textarea [formControl]="postBody" name="post-content" id="post-content"
                    class="w-full border-gray-200 rounded-lg bg-slate-100 text-lg"
                    placeholder="What's on your mind?"></textarea>
            </div>
            <hr />
            <div class="post-actions flex justify-between items-center mt-1">
                <div class="flex items-center gap-2">
                    <label
                        class=" text-green-500 flex items-center gap-1 cursor-pointer duration-150 hover:bg-[#e7f3ff] p-1.5 rounded-md"
                        for="file"><i class="fa-solid fa-image text-xl"></i>Photo/video</label>
                    <input (change)="holdImage($event)" id="file" class="hidden" type="file">
                </div>
                    <button type="button"
                        class="flex items-center gap-2 p-2 text-slate-600 hover:bg-slate-100 rounded-lg">

                    <i class="fa-regular fa-face-smile text-orange-400 text-xl"></i>
                    <span>Feeling/activity</span>

                </button>
                <button type="button"
                        class="ml-auto bg-blue-400 text-white px-5 py-2 rounded-lg font-bold hover:bg-blue-500 duration-150">

                    Post
                    <i class="fa-regular fa-paper-plane ml-1"></i>

                </button>


        </div>

            @if(imgURl()){

              <div class="fileReader">
                <img [src]="imgURl()" alt="">

              </div>
            }
        </div>
    </form>


</section>
