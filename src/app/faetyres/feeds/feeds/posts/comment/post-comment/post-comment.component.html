<div class="bg-slate-200 shadow-2xl shadow-gray-300 rounded-xl p-2">

    <div class="comments-head w-full rounded-md p-2 bg-white">
        <h1 class="font-bold">Comments 2</h1>
    </div>

   @for(comment of commentList() ; track comment._id){

     <div class="comments-body w-full rounded-md p-2 bg-white mt-3 border-b-2 border-gray-400 my-2">

         <div class="comment p-2 flex items-center justify-between">

             <div class="flex gap-2">
                 <div class="comment-user-photo w-10 h-10 rounded-full p-0.5 border-2 border-gray-500">
                     <img class="w-full h-full rounded-full" [src]="comment.commentCreator.photo" alt="">
                 </div>
                 <div class="comment-body bg-slate-200 p-3 rounded-lg">
                     <div class="comment-head">
                         <h4 class="font-bold"> {{comment.commentCreator.name}} </h4>
                         <div class="text-gray-500 text-xs">
                             <span class="mx-0.5">{{comment.commentCreator.username}}.</span>
                             <span class="mx-0.5">spt 15 .</span>
                             <span class="mx-0.5">11:17 PM</span>
                         </div>
                     </div>
                     <div class="comment-info flex flex-col items-center">
                         <p class="my-1 text-gray-600">{{comment.content}}</p>
                         <div class="w-32 h-32 rounded-lg">
                             <img class="w-full h-full rounded-lg" [src]="" alt="">
                         </div>
                     </div>
                 </div>
             </div>

             <div class="flex gap-2 items-center justify-between">
                 <span><i class="fa-regular fa-heart"></i></span>
                 <span>{{comment.likes}}</span>
             </div>
         </div>

     </div>
   }

</div>
