<section class="min-h-screen bg-slate-100 p-3 md:p-7">
  <div class="max-w-7xl mx-auto bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden">

    <!-- Header -->
    <header class="p-5 md:p-6 border-b border-slate-200">
      <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold text-slate-900">
            Notifications
          </h1>

          <p class="text-slate-500 mt-2">
            Realtime updates for likes, comments, shares, and follows.
          </p>
        </div>

        <button
          type="button"
          class="inline-flex items-center justify-center gap-2 self-start border border-slate-200 bg-slate-50 rounded-xl px-4 py-3 text-sm font-semibold text-slate-500 hover:bg-slate-100 cursor-pointer transition">
          <i class="fa-solid fa-check-double" aria-hidden="true"></i>
          Mark all as read
        </button>
      </div>

      <!-- Filters -->
      <div class="flex items-center gap-2 mt-5">
        <button
          type="button"
          class="bg-blue-500 text-white font-bold px-5 py-2 rounded-full cursor-pointer hover:bg-blue-600 transition">
          All
        </button>

        <button
          type="button"
          class="bg-slate-100 text-slate-700 font-bold px-5 py-2 rounded-full cursor-pointer hover:bg-slate-200 transition">
          Unread
        </button>
      </div>
    </header>

    <!-- Notifications -->
    <div class="p-3 md:p-5 space-y-3">

      <!-- Like -->
      <article class="flex items-start gap-3 md:gap-4 border border-slate-200 rounded-2xl p-4 md:p-5 hover:bg-slate-50 transition">
        <img
          src="/Images/default-profile.png"
          alt="Mohamed"
          class="size-12 rounded-full object-cover shrink-0">

        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-3">
            <p class="text-sm md:text-base text-slate-800">
              <span class="font-bold">Mohamed</span>
              liked your post
            </p>

            <span class="text-xs text-slate-500 shrink-0">1h</span>
          </div>

          <p dir="auto" class="text-slate-500 text-sm mt-2 truncate">
            ياهلا يا مرحب
          </p>

          <div class="flex items-center gap-3 mt-3 text-sm">
            <i class="fa-regular fa-heart text-rose-500 text-lg" aria-hidden="true"></i>

            <span class="inline-flex items-center gap-2 text-emerald-600">
              <i class="fa-solid fa-check text-xs" aria-hidden="true"></i>
              Read
            </span>
          </div>
        </div>
      </article>



    </div>
  </div>
</section>
